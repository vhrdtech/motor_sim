[package]
name = "motor_cad"
version = "0.1.0"
description = "Motor geometry from CAD: STEP import, part classification by role, scene and glTF export, parametric test motors"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
monstertruck = { version = "0.4.1", default-features = false, features = ["modeling", "meshing", "assembly", "step"] }
step-p21 = "0.1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
