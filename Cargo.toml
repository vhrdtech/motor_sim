[workspace]
resolver = "3"
members = ["motor_bench", "motor_cad", "motor_demo", "motor_demo_api", "motor_sim", "motor_twin"]
# motor_twin (Bevy) builds only when asked for: `just twin`, `cargo build -p motor_twin`
default-members = ["motor_bench", "motor_cad", "motor_demo", "motor_demo_api", "motor_sim"]

[workspace.package]
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/vhrdtech/motor_sim"

[workspace.dependencies]
anyhow = "1"
clap = "4.5"
clap_complete = "4.6"
console = "0.16"
libc = "0.2"
libm = "0.2"
tokio = "1"
tracing-subscriber = "0.3"

# this workspace
motor_demo_api = { version = "0.3.0", path = "./motor_demo_api" }
motor_sim = { version = "0.2.0", path = "./motor_sim" }

# wire_weaver from a sibling checkout (`just deps-pull` brings it up to its main), until its crates are on crates.io
wire_weaver = { path = "../wire_weaver/wire_weaver", default-features = false }
wire_weaver_client = { path = "../wire_weaver/wire_weaver_client" }
ww_client_server = { path = "../wire_weaver/ww_stdlib/ww_client_server", default-features = false }
ww_device = { path = "../wire_weaver/ww_device" }
ww_si = { path = "../wire_weaver/ww_stdlib/ww_si", default-features = false }
ww_stream = { path = "../wire_weaver/ww_stream", default-features = false }

# motor_cad's B-rep kernel, STEP parser and its own geometry run tens of times slower unoptimised: optimise them in
# dev builds too, so tests stay inside nextest's 3 s
[profile.dev.package.motor_cad]
opt-level = 3
[profile.dev.package.monstertruck-core]
opt-level = 3
[profile.dev.package.monstertruck-geometry]
opt-level = 3
[profile.dev.package.monstertruck-topology]
opt-level = 3
[profile.dev.package.monstertruck-traits]
opt-level = 3
[profile.dev.package.monstertruck-modeling]
opt-level = 3
[profile.dev.package.monstertruck-meshing]
opt-level = 3
[profile.dev.package.monstertruck-mesh]
opt-level = 3
[profile.dev.package.monstertruck-io]
opt-level = 3
[profile.dev.package.step-p21]
opt-level = 3
[profile.dev.package.spade]
opt-level = 3
[profile.dev.package.nom]
opt-level = 3
