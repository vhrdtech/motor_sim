name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor_sim
    steps:
      # motor_demo builds against a sibling wire_weaver checkout (../wire_weaver)
      - uses: actions/checkout@v4
        with:
          path: motor_sim
      - uses: actions/checkout@v4
        with:
          repository: vhrdtech/wire_weaver
          path: wire_weaver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just lint
      - run: just test --profile ci
